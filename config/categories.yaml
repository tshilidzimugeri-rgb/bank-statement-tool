# Categorises transactions for the financial reports (Income Statement,
# Category Breakdown, Cash Flow).
#
# Each entry is one category:
#   name  - shown in the reports
#   type  - one of:
#             income    - counts as income in the Income Statement
#             expense   - counts as an expense in the Income Statement
#             transfer  - money moved between your own accounts; left out of
#                         profit, shown separately in the Cash Flow
#             drawings  - personal/family money taken out of the business;
#                         left out of profit, shown separately in the Cash Flow
#   match - case-insensitive text to look for in the transaction description
#   vat   - optional, yes/no: whether amounts in this category include 15%
#           VAT. Defaults to yes for income and expense categories. You can
#           still change it for a single transaction in the VAT column of
#           the Transactions sheet.
#
# The FIRST category whose match list hits wins, so put specific entries
# above general ones. Anything that matches nothing lands in
# "Other income (uncategorised)" or "Other expenses (uncategorised)" -
# check those in the Category Breakdown and add a rule here for them.
#
# These are general rules anyone in the business can use - no one's
# personal setup (names, family, particular properties). Add rules for your
# own regular payers and payees as needed.
#
# VAT is only set to yes where the category's amounts normally include 15%
# VAT (bank fees, electricity, airtime); fuel is zero-rated, and
# insurance and interest are left at no. Change a single transaction in
# its VAT column; claim input tax only with a valid tax invoice.
#
# You can also change a single transaction's category by editing its
# Category cell in the Transactions sheet - reports recalculate, and the
# edit is kept when more statements are added later.

categories:
  # --- Income -------------------------------------------------------------
  - name: "Interest received"
    type: income
    vat: no  # interest is an exempt financial service
    match: ["interest received", "credit interest", "interest on credit"]

  # --- Expenses -----------------------------------------------------------
  - name: "Interest paid"
    type: expense
    vat: no
    match: ["debit interest", "interest charged", "overdraft interest"]

  - name: "Bank charges"
    type: expense
    match: ["fee:", "fee -", "fee-", "service fee", "management fee", "admin fee", "account fee", "monthly fee",
            "fee immediate", "bank charge"]

  - name: "Water & electricity"
    type: expense
    match: ["electricity", "prepaid elec", "eskom", "municipal", "water purchase"]

  - name: "Airtime & data"
    type: expense
    match: ["airtime", "prepaid mobile", "data bundle", "vodacom", "mtn prepaid", "mtn airtime", "cell c",
            "telkom mobile"]

  - name: "Fuel"
    type: expense
    vat: no  # petrol and diesel are zero-rated
    match: ["engen", "sasol", "shell ", "caltex", "astron energy", "totalenergies", "total garage"]

  - name: "Insurance"
    type: expense
    vat: no  # check each: short-term cover includes VAT, life cover doesn't
    match: ["insurance", "insure", "outsurance", "santam", "hollard"]

  # --- Not profit ---------------------------------------------------------
  # Cash taken out isn't an expense in itself - what it was spent on is.
  - name: "Cash withdrawals"
    type: transfer
    match: ["atm withdrawal", "cash withdrawal", "cash sent"]
