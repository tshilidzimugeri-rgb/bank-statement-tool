# Per-bank detection and column-layout hints.
#
# "detect" - case-insensitive substrings looked for in the extracted text of
#            a statement's first page. First bank that matches wins; if none
#            match, the "generic" heuristics below are used instead.
#
# "period_patterns" - regexes (first capturing group = the statement period
#            string) tried in order against the first page's text. A pattern
#            with two groups (start, end) is joined as "start to end".
#
# "columns" - for each logical column, a list of header-text aliases the
#            column-mapper will look for (case-insensitive, substring match)
#            when it inspects the header row of a table pdfplumber extracts.
#            Add a new bank by copying a block and adjusting these lists -
#            no code changes required for a straightforward text-based
#            statement.
#
# "amount_style":
#   split  - debit and credit are separate columns (most SA banks)
#   signed - a single "amount" column where negative = debit, positive = credit
#
# "account_patterns" (optional) - regexes (one capturing group) for the
#            account number on the first page. Each account gets its own
#            workbook, so two accounts' money is never mixed together.
#
# "control_totals" (optional) - regexes (one capturing group = the amount)
#            for figures the statement prints about itself: total_debits,
#            total_credits, closing_balance. When found, the transactions
#            read must add up to them exactly, or the statement is flagged -
#            this catches a missed first/last row that the running-balance
#            check can't see. total_fees is for statements that total their
#            fees separately and leave them out of total_debits: the debits
#            read may then equal total_debits + total_fees. The generic
#            block's patterns are tried too.
#
# "line_format" (optional) - for the line-by-line reader used when a table
#            can't be split into columns: "thousands" separator in amounts
#            ("," by default, " " for "3 205.00"), "fee_column: true" if
#            rows can carry a separate fee amount before the balance,
#            "dates_without_year: true" for "11 Aug" dates (year taken from
#            the statement period), and "trailing_charges_column: true" for
#            an informational amount after the balance that isn't counted.
#
banks:
  fnb:
    display_name: "FNB"
    detect:
      - "first national bank"
      - "fnb.co.za"
      - "www.fnb.co.za"
    period_patterns:
      - "statement period[:\\s]+([0-9A-Za-z /.\\-]+to[0-9A-Za-z /.\\-]+)"
      - "statement date[:\\s]+([0-9A-Za-z /.\\-]+)"
    # "Easy Account : 62000000000"
    account_patterns: ["account\\s*:?\\s*(\\d{9,12})"]
    # "No. Credit Transactions 12 3,456.78Cr" / "No. Debit Transactions 34 5,678.90Dr"
    control_totals:
      # The last amount on the line - a scan can add junk between the count and it.
      total_credits: ["(?m)^no\\. credit transactions.*?(\\d{1,3}(?:,\\d{3})*\\.\\d{2})\\s*(?:cr|dr)?\\s*$"]
      total_debits: ["(?m)^no\\. debit transactions.*?(\\d{1,3}(?:,\\d{3})*\\.\\d{2})\\s*(?:cr|dr)?\\s*$"]
    # Transaction rows: "11 Aug Payshap ... 700.00 1,950.71Cr 3.00" - no year
    # on the date (taken from the statement period), credits marked Cr, and
    # an "Accrued Bank Charges" column at the end that is charged later as
    # its own row, so it isn't a transaction.
    line_format:
      dates_without_year: true
      trailing_charges_column: true
      # Credits carry "Cr"; an amount or balance without it is a debit /
      # overdrawn (a scan can drop "Dr", but FNB prints none on rows anyway).
      unmarked_is_debit: true
    amount_style: split
    columns:
      date: ["date"]
      description: ["description", "particulars"]
      debit: ["debit", "fees", "amount debited"]
      credit: ["credit", "amount credited"]
      balance: ["balance"]

  standard_bank:
    display_name: "Standard Bank"
    detect:
      - "standard bank"
      - "standardbank.co.za"
      - "the standard bank of south africa"
    account_patterns: ["account number:?\\s*(\\d[\\d ]{6,}\\d)"]
    period_patterns:
      - "statement period[:\\s]+([0-9A-Za-z /.\\-]+to[0-9A-Za-z /.\\-]+)"
      - "period[:\\s]+([0-9A-Za-z /.\\-]+to[0-9A-Za-z /.\\-]+)"
      # 6-month statement: "From: 27 Feb 26" ... "To: 26 Aug 26", with an
      # address line printed between them.
      - "from:\\s*(\\d{1,2} [A-Za-z]{3,9} \\d{2,4})[\\s\\S]{0,80}?to:\\s*(\\d{1,2} [A-Za-z]{3,9} \\d{2,4})"
    # 6-month statement's "Statement Summary": Payments -R321,778.92 /
    # Deposits R465,000.00. (The column header "Payments Deposits Balance"
    # has no amount after it, so it doesn't match.)
    control_totals:
      total_debits: ["(?m)^payments\\s+-?r\\s?(-?[\\d,]+\\.\\d{2})\\s*$"]
      total_credits: ["(?m)^deposits\\s+r\\s?(-?[\\d,]+\\.\\d{2})\\s*$"]
    amount_style: split
    columns:
      date: ["date", "transaction date"]
      description: ["description", "transaction description"]
      debit: ["debit", "withdrawal", "amount debited"]
      credit: ["credit", "deposit", "amount credited"]
      balance: ["balance"]

  absa:
    display_name: "ABSA"
    detect:
      - "absa bank"
      - "absa.co.za"
      - "amalgamated banks of south africa"
    period_patterns:
      - "statement period[:\\s]+([0-9A-Za-z /.\\-]+to[0-9A-Za-z /.\\-]+)"
      - "from[:\\s]+([0-9A-Za-z /.\\-]+to[0-9A-Za-z /.\\-]+)"
    amount_style: split
    columns:
      date: ["date"]
      description: ["description", "transaction detail"]
      debit: ["debit", "payments"]
      credit: ["credit", "deposits"]
      balance: ["balance"]

  nedbank:
    display_name: "Nedbank"
    detect:
      - "nedbank"
      - "nedbank.co.za"
    period_patterns:
      - "statement period[:\\s]+([0-9A-Za-z /.\\-]+to[0-9A-Za-z /.\\-]+)"
      - "statement date[:\\s]+([0-9A-Za-z /.\\-]+)"
    amount_style: split
    columns:
      date: ["date", "posting date"]
      description: ["description", "narrative"]
      debit: ["debit", "amount debited"]
      credit: ["credit", "amount credited"]
      balance: ["balance"]

  capitec:
    display_name: "Capitec"
    detect:
      - "capitec bank"
      - "capitecbank.co.za"
    account_patterns: ["(?m)^account\\s+(\\d{6,})"]
    period_patterns:
      - "statement period[:\\s]+([0-9A-Za-z /.\\-]+to[0-9A-Za-z /.\\-]+)"
      - "date range[:\\s]+([0-9A-Za-z /.\\-]+to[0-9A-Za-z /.\\-]+)"
      # "From Date: 01/08/2026 ... To Date: 26/09/2026" on separate lines.
      - "from date:\\s*(\\d{2}/\\d{2}/\\d{4})[\\s\\S]{0,120}?to date:\\s*(\\d{2}/\\d{2}/\\d{4})"
    # "Money In Summary R23 340.54 Money Out Summary -R23 721.56" (money
    # out includes fees).
    control_totals:
      total_credits: ["money in summary\\s+r\\s?(-?\\d{1,3}(?:[ ,]\\d{3})*\\.\\d{2})"]
      total_debits: ["money out summary\\s+-?r\\s?(-?\\d{1,3}(?:[ ,]\\d{3})*\\.\\d{2})"]
    # Transaction History rows: "date description [money in|money out]
    # [fee] balance", amounts signed with space thousands ("-3 205.00").
    line_format:
      thousands: " "
      fee_column: true
    amount_style: signed
    columns:
      date: ["date", "posting date"]
      description: ["description"]
      amount: ["amount"]
      balance: ["balance"]

  # The other South African banks. Their statements are read by the same
  # layout-independent reader as every bank (see README "How statements are
  # checked"); these entries name the bank. Detection strings are the
  # banks' own names and web addresses as printed on their statements -
  # not merchant names, so a debit order to one of them in another bank's
  # statement doesn't relabel it (the banks above are also checked first).
  investec:
    display_name: "Investec"
    detect: ["investec bank limited", "investec.co.za", "investec.com"]
    amount_style: split
    columns: &other_bank_columns
      date: ["date", "transaction date", "posting date"]
      description: ["description", "narrative", "transaction details", "details"]
      debit: ["debit", "debits", "money out", "withdrawals"]
      credit: ["credit", "credits", "money in", "deposits"]
      balance: ["balance"]
      amount: ["amount"]

  tymebank:
    display_name: "TymeBank"
    detect: ["tymebank", "tyme bank limited", "tymebank.co.za"]
    amount_style: split
    columns: *other_bank_columns

  discovery:
    display_name: "Discovery Bank"
    detect: ["discovery bank limited", "discovery bank ltd", "discovery.co.za/bank"]
    amount_style: split
    columns: *other_bank_columns

  african_bank:
    display_name: "African Bank"
    detect: ["african bank limited", "africanbank.co.za"]
    amount_style: split
    columns: *other_bank_columns

  bank_zero:
    display_name: "Bank Zero"
    detect: ["bank zero mutual bank", "bankzero.co.za"]
    amount_style: split
    columns: *other_bank_columns

  old_mutual:
    display_name: "Old Mutual"
    detect: ["old mutual bank", "oldmutual.co.za/money-account", "old mutual money account"]
    amount_style: split
    columns: *other_bank_columns

# Used when no "detect" strings match. Widens the alias lists so common
# layouts from an unlisted bank still have a decent chance of being parsed.
# Statements handled this way are always flagged "Bank detection: generic"
# in the run summary so they get a look before you trust the numbers.
generic:
  display_name: "Unknown/Generic"
  # Tried for every bank after its own account_patterns.
  # "Account number: 1234 567 890", "Account No. ...", "Easy Account : 62...",
  # or "Account 1234567890" at the start of a line (8+ digits, so amounts
  # after the word "account" aren't mistaken for it).
  account_patterns:
    - "account (?:number|no\\.?)[:\\s]*(\\d[\\d -]{5,}\\d)"
    - "account\\s*:\\s*(\\d{8,})"
    - "(?m)^account\\s+(\\d{8,})"
  period_patterns:
    - "statement period[:\\s]+([0-9A-Za-z /.\\-]+to[0-9A-Za-z /.\\-]+)"
    - "period[:\\s]+([0-9A-Za-z /.\\-]+to[0-9A-Za-z /.\\-]+)"
    # A line holding only the period: "1 Jun 2025 to 30 Jun 2025", "01/06/2025 to 30/06/2025".
    - "(?m)^\\s*(\\d{1,2}\\s?[a-z]{3,9}\\.?\\s?\\d{2,4}|\\d{1,2}[/.-]\\d{1,2}[/.-]\\d{2,4}|\\d{4}[/.-]\\d{1,2}[/.-]\\d{1,2})\\s*to\\s*(\\d{1,2}\\s?[a-z]{3,9}\\.?\\s?\\d{2,4}|\\d{1,2}[/.-]\\d{1,2}[/.-]\\d{2,4}|\\d{4}[/.-]\\d{1,2}[/.-]\\d{1,2})\\s*$"
    - "statement date[:\\s]+([0-9A-Za-z /.\\-]+)"
  # Tried for every bank after its own control_totals. Amounts as
  # "12,345.67" or, with a decimal comma, "12 345,67" / "12.345,67".
  control_totals:
    closing_balance: ["closing balance[:\\s]+r?\\s?(-?(?:\\d{1,3}(?:[ ,]\\d{3})*\\.\\d{2}(?![\\d,])|\\d{1,3}(?:[ .]\\d{3})*,\\d{2}(?!\\d))(?:\\s?(?:cr|dr)\\b)?)"]
    # "Total debits 12,345.67" / "Total credits ..." and common wordings.
    total_debits:
      - "total (?:debits|withdrawals|payments|money out)[:\\s]+-?r?\\s?(\\d{1,3}(?:[ ,]\\d{3})+\\.\\d{2}|\\d+\\.\\d{2}(?![\\d,])|\\d{1,3}(?:[ .]\\d{3})+,\\d{2}(?!\\d)|\\d+,\\d{2}(?!\\d))"
    total_credits:
      - "total (?:credits|deposits|receipts|money in)[:\\s]+r?\\s?(\\d{1,3}(?:[ ,]\\d{3})+\\.\\d{2}|\\d+\\.\\d{2}(?![\\d,])|\\d{1,3}(?:[ .]\\d{3})+,\\d{2}(?!\\d)|\\d+,\\d{2}(?!\\d))"
    # Fees some statements total apart from, and leave out of, their total debits:
    # "Total service fees (R1,30 VAT included) 10,00".
    total_fees:
      - "total (?:service |bank )?(?:fees|charges)(?:\\s*\\([^)]*\\))?[:\\s]+-?r?\\s?(\\d{1,3}(?:[ ,]\\d{3})+\\.\\d{2}|\\d+\\.\\d{2}(?![\\d,])|\\d{1,3}(?:[ .]\\d{3})+,\\d{2}(?!\\d)|\\d+,\\d{2}(?!\\d))"
  amount_style: split
  columns:
    date: ["date", "transaction date", "posting date"]
    description: ["description", "narrative", "particulars", "transaction detail", "details"]
    debit: ["debit", "withdrawal", "withdrawals", "payments", "amount debited"]
    credit: ["credit", "deposit", "deposits", "amount credited"]
    balance: ["balance", "closing balance"]
    amount: ["amount"]
